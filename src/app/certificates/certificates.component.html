<div class="cert-container">
    <h2 class="section-title">Certificaciones y Logros</h2>
    
    <div class="grid-certificados">
        @for (cert of certificados; track cert.titulo) {
            <a [href]="cert.archivo" target="_blank" class="cert-card">
                <div class="cert-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 512" fill="#ff0000">
                        <path d="M64 0C28.7 0 0 28.7 0 64V448c0 35.3 28.7 64 64 64H320c35.3 0 64-28.7 64-64V160H256c-17.7 0-32-14.3-32-32V0H64zM256 0V128H384L256 0zM112 256H272c8.8 0 16 7.2 16 16s-7.2 16-16 16H112c-8.8 0-16-7.2-16-16s7.2-16 16-16zm0 64H272c8.8 0 16 7.2 16 16s-7.2 16-16 16H112c-8.8 0-16-7.2-16-16s7.2-16 16-16zm0 64H272c8.8 0 16 7.2 16 16s-7.2 16-16 16H112c-8.8 0-16-7.2-16-16s7.2-16 16-16z"/>
                    </svg>
                </div>
                <div class="cert-info">
                    <h3 class="cert-title">{{ cert.titulo }}</h3>
                    <p class="cert-emisor">{{ cert.emisor }}</p>
                </div>
                <div class="cert-year">
                    <span>{{ cert.fecha }}</span>
                </div>
            </a>
        }
    </div>
</div>
